<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0d14"><title>PC Build Randomizer</title><style>:root{--bg:#0a0d14;--card:#111722;--card2:#171e2b;--text:#f4f7fb;--muted:#9ba8ba;--accent:#67e8f9;--accent2:#8b5cf6;--good:#4ade80;--line:#263244}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17233b 0,#0a0d14 42%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.wrap{max-width:1050px;margin:auto;padding:30px 18px 50px}.hero{text-align:center}.hero h1{font-size:clamp(34px,8vw,62px);margin:0 0 8px;letter-spacing:-2px}.hero p{color:var(--muted);font-size:17px}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:22px 0 28px}button{border:0;border-radius:12px;padding:13px 18px;font-weight:800;font-size:15px;cursor:pointer;background:var(--accent);color:#071018}button.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line)}button:active{transform:scale(.97)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.stat,.part,.notice{background:rgba(17,23,34,.94);border:1px solid var(--line);border-radius:16px}.stat{padding:17px}.label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px}.value{font-size:25px;font-weight:900;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.part{padding:17px;display:flex;justify-content:space-between;gap:12px}.part h3{margin:0 0 5px;font-size:15px}.part p{margin:0;color:var(--muted);font-size:13px}.price{font-weight:900;white-space:nowrap}.bar{height:9px;background:#202938;border-radius:99px;overflow:hidden;margin-top:9px}.fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px}.notice{margin-top:16px;padding:14px;color:#c8fbd8}.saved{margin-top:22px}.saved h2{font-size:19px}.saved-list{display:flex;gap:9px;flex-wrap:wrap}.chip{background:var(--card2);border:1px solid var(--line);padding:9px 12px;border-radius:10px;color:var(--muted)}@media(max-width:700px){.grid,.summary{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><h1>PC Build Randomizer 🎲</h1><p>Generate a random gaming PC — then make it better.</p></section><div class="actions"><button id="generate">🎲 Generate Build</button><button class="secondary" id="upgrade">🔥 Make It Better</button><button class="secondary" id="save">💾 Save Build</button></div><div class="summary"><div class="stat"><div class="label">Estimated Price</div><div class="value" id="total">$0</div></div><div class="stat"><div class="label">Gaming Tier</div><div class="value" id="tier">—</div></div><div class="stat"><div class="label">Build Score</div><div class="value" id="score">—</div></div></div><div class="grid" id="parts"></div><div class="notice" id="notice">Generate a build to get started.</div><section class="saved"><h2>Saved Builds</h2><div class="saved-list" id="saved"></div></section></main><script>
const data={CPU:[["Ryzen 5 7600",190,48],["Ryzen 7 7800X3D",360,78],["Ryzen 7 9800X3D",480,92],["Ryzen 9 9950X3D",700,96],["Core i5-14600K",260,67],["Core i7-14700K",390,80],["Core i9-14900K",500,84]],GPU:[["RTX 4060",300,46],["RTX 4070 SUPER",600,70],["RTX 5070",550,76],["RTX 5070 Ti",750,84],["RTX 5080",1000,94],["RX 7800 XT",500,68],["RX 9070 XT",700,88],["RX 7900 XTX",900,86]],Motherboard:[["B650 WiFi",170,55],["B850 WiFi",220,72],["X870 WiFi",300,82],["X870E",400,92],["Z790 WiFi",260,78]],RAM:[["32GB DDR5-6000",100,55],["64GB DDR5-6000 CL30",190,78],["64GB DDR5-6400",230,84],["96GB DDR5-6000",300,87]],Storage:[["1TB NVMe Gen4",75,45],["2TB NVMe Gen4",130,65],["4TB NVMe Gen4",260,80],["2TB NVMe Gen5",230,86]],Cooler:[["Air Cooler",45,45],["Dual-Tower Air Cooler",90,68],["240mm AIO",110,72],["360mm AIO",150,85],["360mm Premium AIO",220,92]],Case:[["Budget Airflow Case",70,50],["Mid-Tower Airflow",110,65],["Premium Mid-Tower",180,80],["HYTE Y70",230,88],["Large Showcase Case",300,92]],PSU:[["650W Gold",90,52],["750W Gold",110,65],["850W Gold",140,78],["1000W Gold",180,88],["1200W Gold",240,94]]};
const order=["CPU","GPU","Motherboard","RAM","Storage","Cooler","Case","PSU"];let build={};const pick=a=>a[Math.floor(Math.random()*a.length)];
function generate(){build={};order.forEach(k=>build[k]=pick(data[k]));render()}
function upgrade(){if(!Object.keys(build).length)return generate();const possible=order.filter(k=>data[k].some(x=>x[2]>build[k][2]));if(!possible.length)return;const k=pick(possible);const opts=data[k].filter(x=>x[2]>build[k][2]);build[k]=opts[Math.min(Math.floor(Math.random()*2),opts.length-1)];render()}
function compatibility(){if(!build.GPU)return "Generate a build to get started.";let n=[];if(build.GPU[2]>=88&&build.PSU[2]<78)n.push("Consider a stronger PSU for this GPU.");if(build.CPU[0].includes("9950X3D")&&build.Cooler[2]<85)n.push("A stronger cooler is recommended for this CPU.");return n.length?"⚠️ "+n.join(" "):"✅ Parts look broadly compatible. Verify exact socket, dimensions, RAM support and PSU requirements before buying."}
function render(){let total=0,avg=0;parts.innerHTML="";order.forEach(k=>{const x=build[k];total+=x[1];avg+=x[2];parts.insertAdjacentHTML("beforeend",`<div class="part"><div><h3>${k}</h3><p>${x[0]}</p><div class="bar"><div class="fill" style="width:${x[2]}%"></div></div></div><div class="price">$${x[1]}</div></div>`)});avg=Math.round(avg/order.length);document.getElementById("total").textContent="$"+total.toLocaleString();document.getElementById("score").textContent=avg+"/100";document.getElementById("tier").textContent=avg>=90?"BEAST":avg>=80?"HIGH-END":avg>=65?"UPPER-MID":avg>=50?"MID-RANGE":"ENTRY";document.getElementById("notice").textContent=compatibility()}
function saveBuild(){if(!Object.keys(build).length)return;const s=JSON.parse(localStorage.getItem("pcbuilds")||"[]"),total=Object.values(build).reduce((a,x)=>a+x[1],0);s.unshift({total,date:new Date().toLocaleString()});localStorage.setItem("pcbuilds",JSON.stringify(s.slice(0,8)));showSaved()}
function showSaved(){const s=JSON.parse(localStorage.getItem("pcbuilds")||"[]");saved.innerHTML=s.length?s.map(x=>`<div class="chip">💻 $${x.total.toLocaleString()} · ${x.date}</div>`).join(""):"<span class='chip'>No saved builds yet.</span>"}
document.getElementById("generate").onclick=generate;document.getElementById("upgrade").onclick=upgrade;document.getElementById("save").onclick=saveBuild;generate();showSaved();
</script></body></html>
